{% extends "base.html" %}
{% block title %}500 — Server Error · {{ BRAND_NAME }}{% endblock %}
{% block content %}
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem;">
  <div>
    <div style="font-family:var(--font-display); font-size:clamp(8rem,20vw,18rem); line-height:0.9; color:var(--border); letter-spacing:-0.04em;">500</div>
    <h1 style="font-family:var(--font-display); font-size:clamp(2rem,5vw,4rem); margin-top:1rem;">SERVER ERROR</h1>
    <p style="color:var(--text-muted); margin:1rem 0 2rem;">Something broke on our end. We're on it.</p>
    <a href="/" class="btn btn-primary" data-transition>Back to Home</a>
  </div>
</div>
{% endblock %}
